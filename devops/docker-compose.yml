services:
  backend:
    build:
      context: ..
      dockerfile: devops/Dockerfile.backend
    container_name: smart-cooling-backend
    env_file:
      - ../.env
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      BACKEND_HEALTH_PATH: ${BACKEND_HEALTH_PATH}
      BACKEND_METRICS_PATH: ${BACKEND_METRICS_PATH}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${BACKEND_PORT}:8000"
    networks:
      - smart-cooling-net
    restart: unless-stopped

  rl-agent:
    build:
      context: ..
      dockerfile: devops/Dockerfile.rl
    container_name: smart-cooling-rl-agent
    env_file:
      - ../.env
    environment:
      RL_HOST: ${RL_HOST}
      RL_PORT: ${RL_PORT}
      RL_HEALTH_PATH: ${RL_HEALTH_PATH}
      RL_METRICS_PATH: ${RL_METRICS_PATH}
      MODEL_PATH: /app/models/best_model.zip
      INFERENCE_MODE: api
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${RL_PORT}:8001"
    networks:
      - smart-cooling-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: smart-cooling-prometheus
    env_file:
      - ../.env
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - smart-cooling-net
    restart: unless-stopped
    depends_on:
      - backend
      - rl-agent
    profiles:
      - monitoring
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: smart-cooling-grafana
    env_file:
      - ../.env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - smart-cooling-net
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - full

  mlflow:
    image: python:3.11-slim
    container_name: smart-cooling-mlflow
    working_dir: /mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri sqlite:///mlflow.db
             --default-artifact-root /mlflow/artifacts"
    env_file:
      - ../.env
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - smart-cooling-net
    restart: unless-stopped
    profiles:
      - full

networks:
  smart-cooling-net:
    driver: bridge

volumes:
  grafana-data:
  prometheus-data:
  mlflow-data: